<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de prețuri xPrice</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111827;color:#f1f5f9}
body{max-width:980px;margin:auto;padding:2rem 1rem}h1{font-size:clamp(2rem,6vw,3.5rem);margin-bottom:.4rem}
p,small{color:#cbd5e1}a{color:#99f6e4}.filters{display:flex;flex-wrap:wrap;gap:1rem;margin:2rem 0}
label{display:grid;gap:.4rem}select,input{font:inherit;padding:.65rem;border:1px solid #64748b;border-radius:.45rem;background:#1e293b;color:inherit}
#offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1rem}
article{padding:1.25rem;background:#1e293b;border:1px solid #475569;border-radius:.75rem}article h2{font-size:1.2rem}strong{color:#99f6e4;font-size:1.6rem}
</style>
</head>
<body>
<header>
  <h1>Radar de prețuri xPrice</h1>
  <p>Prețuri observate astăzi, strict sub minimul anterior din perioada aleasă.</p>
</header>
<p id="source" role="status">Se încarcă rezultatele xPrice…</p>
<form class="filters">
  <label>Caută produs <input id="query" type="search"></label>
  <label>Perioadă <select id="period">
    <option value="6">6 luni</option><option value="12">12 luni</option><option value="24">24 de luni</option>
  </select></label>
  <label>Reducere față de minimul anterior <select id="threshold">
    <option value="0">Orice record nou</option><option value="15">Cel puțin 15%</option>
  </select></label>
</form>
<p id="count" role="status"></p>
<section id="offers" aria-label="Recorduri de preț"></section>
<script>
const el = id => document.getElementById(id);
const money = new Intl.NumberFormat('ro-RO', {style:'currency', currency:'RON'});
const percent = new Intl.NumberFormat('ro-RO', {maximumFractionDigits:2});
const dateParts = new Intl.DateTimeFormat('ro-RO', {
  timeZone:'Europe/Bucharest', year:'numeric', month:'2-digit', day:'2-digit'
}).formatToParts();
const part = type => dateParts.find(item => item.type === type).value;
const today = [part('year'), part('month'), part('day')].join('-');
const add = (parent, tag, value) => {
  const node = document.createElement(tag);
  node.textContent = value;
  parent.append(node);
  return node;
};

function showRecords(rows) {
  const period = el('period').value;
  const threshold = Number(el('threshold').value);
  const query = el('query').value.trim().toLocaleLowerCase('ro');
  const matches = rows
    .filter(row => row.name.toLocaleLowerCase('ro').includes(query))
    .map(row => ({row, record:row.records?.[period]}))
    .filter(({row, record}) => Number.isFinite(record?.previousMin) && row.price < record.previousMin
      && Number.isFinite(record.percentBelow) && record.percentBelow >= threshold)
    .sort((a, b) => b.record.percentBelow - a.record.percentBelow);
  const list = el('offers');
  list.replaceChildren();
  el('count').textContent = matches.length ? matches.length + ' rezultate' :
    'Niciun record din eșantion nu corespunde filtrelor.';
  for (const {row, record} of matches) {
    const card = add(list, 'article', '');
    add(card, 'h2', row.name);
    add(card, 'strong', money.format(row.price));
    add(card, 'p', 'Minim anterior: ' + money.format(record.previousMin));
    add(card, 'p', percent.format(record.percentBelow) + '% sub minimul anterior');
    add(card, 'p', 'Observat la ' + row.observedDate + ' · ' + record.observations + ' prețuri anterioare');
    add(card, 'a', 'Vezi istoricul pe xPrice').href = row.url;
  }
}

async function init() {
  try {
    const response = await fetch('./xprice-records.json', {cache:'no-cache'});
    if (!response.ok) throw new Error('Date indisponibile');
    const snapshot = await response.json();
    if (!Array.isArray(snapshot.records) || typeof snapshot.date !== 'string') throw new Error('Date invalide');
    const rows = snapshot.records.filter(row => row?.observedDate === today &&
      typeof row.name === 'string' && Number.isFinite(row.price) && row.price > 0 &&
      /^https:\/\/xprice\.ro\/istoric-pret\//.test(row.url));
    el('source').textContent = snapshot.date === today
      ? 'Scanare pilot xPrice · ' + snapshot.scanned + ' pagini verificate · ' + snapshot.date
      : 'Ultima scanare: ' + snapshot.date + '. Încă nu avem date pentru azi.';
    const form = document.querySelector('form');
    form.addEventListener('submit', event => event.preventDefault());
    form.addEventListener('input', () => showRecords(rows));
    showRecords(rows);
  } catch {
    el('source').textContent = 'Rezultatele xPrice nu sunt disponibile momentan.';
  }
}
init();
</script>
</body>
</html>
